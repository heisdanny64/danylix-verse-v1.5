<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / PWA viewport (zoom locked for app-like feel) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Title & SEO -->
    <title>D. Verse — Under Maintenance</title>
    <meta name="description" content="D. Verse is undergoing scheduled maintenance while we roll out new updates. We'll be back online shortly." />
    <meta name="author" content="Danylix" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0f" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="D. Verse — Under Maintenance" />
    <meta property="og:description" content="D. Verse is undergoing scheduled maintenance. We'll be back online shortly." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="D. Verse — Under Maintenance" />
    <meta name="twitter:description" content="D. Verse is undergoing scheduled maintenance. We'll be back online shortly." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("/sw.js")
        .then((reg) => console.log("SW registered:", reg.scope))
        .catch((err) => console.log("SW failed:", err));
    });
  }
    </script>
  </body>
</html>
