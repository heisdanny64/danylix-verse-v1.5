[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Edge function for dynamic OG tags on detail pages
[[edge_functions]]
  path = "/movie/*"
  function = "og"

[[edge_functions]]
  path = "/tv/*"
  function = "og"

[[edge_functions]]
  path = "/anime/*"
  function = "og"

[[edge_functions]]
  path = "/details/*"
  function = "og"

# SPA catch-all — all other routes serve index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache sw.js as no-cache so PWA updates reach users immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Cache manifest for 1 day
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache Vite build assets forever (they're content-hashed)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
